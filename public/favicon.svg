<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="p4u-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="100%" stop-color="#D85A3A"/>
    </linearGradient>
  </defs>
  <!-- P4U text with camera shutter aperture integrated into center -->
  <!-- P -->
  <text x="40" y="75" text-anchor="middle" font-family="'Lato', 'sans-serif" font-size="38" font-weight="700" fill="url(#p4u-grad)">P</text>
  <!-- 4 with camera aperture -->
  <g transform="translate(55, 35) scale(0.85)">
    <circle cx="40" cy="40" r="18" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="40" cy="40" r="5" fill="#fff"/>
    <line x1="40" y1="28" x2="40" y2="52" stroke="#fff" stroke-width="2"/>
    <line x1="28" y1="40" x2="52" y2="40" stroke="#fff" stroke-width="2"/>
    <line x1="31" y1="31" x2="49" y2="49" stroke="#fff" stroke-width="1.5"/>
    <line x1="49" y1="31" x2="31" y2="49" stroke="#fff" stroke-width="1.5"/>
  </g>
  <text x="72" y="75" text-anchor="middle" font-family="'Lato', 'sans-serif" font-size="38" font-weight="700" fill="url(#p4u-grad)">U</text>
</svg>
